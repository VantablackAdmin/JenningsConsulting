<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jennings Consulting | New Site Coming Soon</title>
  <meta name="description" content="Jennings Consulting is rebuilding its website. Still taking calls in the Mid-Ohio Valley." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #121316;
      --bg-1: #1c1f25;
      --tile: rgba(255,255,255,.045);
      --line: rgba(255,255,255,.12);
      --edge-hi: rgba(255,255,255,.14);
      --ink: #f5f1fc;
      --text: #e6e0f2;
      --faint: #a79ec4;
      --violet: #b79bf0;
      --violet-bright: #cbb6ff;
      --violet-deep: #6a44ad;
      --violet-deep-2: #7d55c8;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Libre Franklin', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      font-weight: 300;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(138,99,212,.22), transparent 70%),
        radial-gradient(ellipse 60% 50% at 85% 100%, rgba(106,68,173,.16), transparent 70%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0));
      background-color: var(--bg-0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--tile);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 var(--edge-hi), 0 30px 70px -28px rgba(0,0,0,.6);
      backdrop-filter: blur(12px) saturate(1.25);
      -webkit-backdrop-filter: blur(12px) saturate(1.25);
      border-radius: 20px;
      padding: clamp(32px, 7vw, 56px);
      text-align: center;
      animation: rise .8s ease-out both;
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.35rem;
      color: var(--ink);
      letter-spacing: .01em;
    }
    .logo span { color: var(--violet); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 32px 0 20px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--violet);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--violet-bright);
      box-shadow: 0 0 0 0 rgba(203,182,255,.6);
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      line-height: 1.08;
      color: var(--ink);
    }
    h1 em { color: var(--violet-bright); }

    p.lede {
      margin: 18px auto 0;
      max-width: 40ch;
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--text);
    }

    .contact {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--violet-deep); color: var(--ink); }
    .btn-primary:hover { background: var(--violet-deep-2); }
    .btn-ghost { border: 1px solid var(--line); color: var(--text); word-break: break-all; }
    .btn-ghost:hover { border-color: var(--violet); color: var(--ink); }
    .btn:focus-visible { outline: 2px solid var(--violet-bright); outline-offset: 3px; }

    footer {
      margin-top: 28px;
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .08em;
      color: var(--faint);
      text-align: center;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(203,182,255,.55); }
      70%  { box-shadow: 0 0 0 9px rgba(203,182,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(203,182,255,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .dot { animation: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Jennings<span> Consulting.</span></div>

    <div class="status"><span class="dot" aria-hidden="true"></span>Under construction</div>

    <h1>Something new is <em>on the way.</em></h1>

    <p class="lede">We're rebuilding the site from the ground up. In the meantime, we're still taking calls and booking work around the Mid-Ohio Valley.</p>

    <div class="contact">
      <a class="btn btn-primary" href="tel:3046998806">Call (304) 699-8806</a>
      <a class="btn btn-ghost" href="mailto:JenningsConsulting@protonmail.com">JenningsConsulting@protonmail.com</a>
    </div>
  </main>

  <footer>&copy; <span id="yr">2026</span> Jennings Consulting LLC</footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
